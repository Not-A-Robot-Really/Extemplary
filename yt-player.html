<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  html, body, #player { margin:0; padding:0; width:100%; height:100%; background:#000; }
</style>
</head>
<body>
<div id="player"></div>
<script>
  // Sandboxed YouTube player bridge:
  // Manifest V3 extension can only load scripts from itself, so the youtube ifram API
  // (https://www.youtube.com/iframe_api) can't work when it is directly in
  // index.html. This page is declared under manifest.json's
  // "sandbox" key, which puts it in its own unique origin without access to crhome. THerefore, it's allowed to load the real API here.
  // Index.html embeds this page in <iframe> entirely
  // through postMessage so nothing here ever could touch any extension API.

  let ytPlayer = null;
  let parentOrigin = null;
  let pendingConfig = null;
  let tickTimer = null;

  function post(msg) {
    if (parentOrigin) window.parent.postMessage(msg, parentOrigin);
  }

  function startTicking() {
    if (tickTimer) return;
    tickTimer = setInterval(() => {
      if (!ytPlayer || !ytPlayer.getCurrentTime) return;
      post({
        type: 'tick',
        time: ytPlayer.getCurrentTime(),
        state: ytPlayer.getPlayerState ? ytPlayer.getPlayerState() : -1
      });
    }, 200);
  }

  function initPlayer(cfg) {
    ytPlayer = new YT.Player('player', {
      videoId: cfg.videoId,
      width: '100%',
      height: '100%',
      playerVars: cfg.playerVars || {},
      events: {
        onReady: () => { post({ type: 'ready' }); startTicking(); },
        onStateChange: (e) => post({ type: 'stateChange', state: e.data }),
        onError: (e) => post({ type: 'error', error: e.data })
      }
    });
  }

  // Called by the official YouTube script once it finishes loading.
  window.onYouTubeIframeAPIReady = function () {
    if (pendingConfig) { initPlayer(pendingConfig); pendingConfig = null; }
  };

  window.addEventListener('message', (e) => {
    const data = e.data;
    if (!data || typeof data !== 'object') return;

    if (data.type === 'init') {
      // First message from the parent also tells us its origin, so we know
      // where to send replies (the sandbox's own origin is opaque/unique,
      // but the parent extension page's origin is stable and known to it).
      parentOrigin = e.origin;
      pendingConfig = data.config;
      if (window.YT && window.YT.Player) initPlayer(pendingConfig);
      return;
    }

    if (!ytPlayer) return;
    switch (data.type) {
      case 'play':
        ytPlayer.playVideo();
        break;
      case 'pause':
        ytPlayer.pauseVideo();
        break;
      case 'seek':
        ytPlayer.seekTo(data.time, true);
        if (data.play !== false) ytPlayer.playVideo();
        break;
    }
  });

  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
</script>
</body>
</html>
